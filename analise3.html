  .campaign { padding:0; }
  .campaign img { display:block; width:100%; height:auto; }
  .bubble { background:#242424; border:1px solid #333; border-radius:4px 16px 16px 16px;
            padding:12px 14px; max-width:85%; font-size:15px; line-height:1.45; animation:pop .25s ease; }
  .bubble.q { color:#e8c876; font-weight:700; }
  .row.user { justify-content:flex-end; }
  .bubble.user { background:#e8c876; color:#111; border-radius:16px 4px 16px 16px; font-weight:600; font-size:14px; }
  .typing { display:inline-flex; gap:4px; padding:14px 16px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#888; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  @keyframes pop { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .options { display:flex; flex-direction:column; gap:8px; margin:4px 0 4px 40px; }
  .opt { background:#1e1e1e; border:1px solid #555; color:#eee; border-radius:12px;
         padding:12px 14px; font-size:14px; cursor:pointer; text-align:left;
         display:flex; align-items:flex-start; gap:10px; animation:pop .25s ease; line-height:1.4; }
  .opt:hover { border-color:#e8c876; }
  .opt .dot { width:15px; height:15px; border:2px solid #e8c876; border-radius:50%; flex-shrink:0; margin-top:2px; }
  .opt b { color:#e8c876; }
  .restart { align-self:center; margin:10px 0; background:transparent; border:1px solid #555;
             color:#ccc; border-radius:20px; padding:9px 22px; font-size:13px; cursor:pointer; }
  .restart:hover { border-color:#e8c876; color:#e8c876; }
  footer { padding:12px; border-top:1px solid #2a2a2a; text-align:center; color:#666; font-size:11px; }

  #splash { position:fixed; inset:0; z-index:50; background:#0d0d0d; display:flex;
            flex-direction:column; align-items:center; justify-content:flex-end;
            transition:opacity .4s ease; }
  #splash.hidden { opacity:0; pointer-events:none; }
  #splash img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #startBtn { position:relative; z-index:2; margin-bottom:56px; background:#e8c876; color:#111;
              border:none; border-radius:30px; padding:16px 46px; font-size:17px;
              font-weight:800; cursor:pointer; box-shadow:0 4px 24px rgba(232,200,118,.35); }
  #startBtn:active { transform:scale(.97); }

  #entry { position:fixed; inset:0; z-index:60; background:#0d0d0d; display:flex;
           align-items:center; justify-content:center; }
  #entry .box { text-align:center; padding:40px 28px; max-width:420px; width:100%; }
  #entry .logo img { width:148px; height:148px; border-radius:50%;
      border:2px solid #e8c876; box-shadow:0 0 44px rgba(232,200,118,.28); }
  #entry h1 { color:#e8c876; font-size:23px; margin-top:26px; letter-spacing:.5px; }
  #entry .art { margin-top:26px; }
  #entry .art img { width:100%; max-width:330px; border-radius:16px;
      border:1px solid rgba(232,200,118,.5); box-shadow:0 8px 32px rgba(0,0,0,.5); }
  #entry .cta { margin-top:32px; }
  #entry .cta button { background:#e8c876; color:#111; border:none; border-radius:30px;
      padding:16px 68px; font-size:18px; font-weight:800; cursor:pointer;
      box-shadow:0 4px 24px rgba(232,200,118,.35); }
  #entry .cta button:active { transform:scale(.97); }
  #app[hidden] { display:none; }
  .bubble .cand { color:#e8c876; font-weight:800; }
</style>
</head>

<script>document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('entry').style.display = 'none';
  document.getElementById('app').removeAttribute('hidden');
});

const chat = document.getElementById('chat');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function botMsg(html, cls='') {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="avatar"></div><div class="bubble ${cls}">${html}</div>`;
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
}
function userMsg(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble user">${text}</div>`;
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
}
async function typing() {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="avatar"></div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
  await sleep(800); row.remove();
}
function askQuestion(q, options) {
  return new Promise(async (resolve) => {
    await typing(); botMsg(q, 'q');
    const box = document.createElement('div');
    box.className = 'options';
    options.forEach(([letter, text]) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = `<span class="dot"></span><span><b>${letter})</b> ${text}</span>`;
      b.onclick = () => { box.remove(); userMsg(`${letter}) ${text}`); resolve(letter); };
      box.appendChild(b);
    });
    chat.appendChild(box); chat.scrollTop = chat.scrollHeight;
  });
}

document.getElementById('splashImg').src = document.querySelector('.campaign img').src;
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('splash').classList.add('hidden');
  setTimeout(() => document.getElementById('splash').remove(), 450);
  run();
});

async function run() {
  await typing();
  botMsg('Olá! Vamos falar sobre as <b>Eleições 2026</b> para Deputado Estadual no Paraná? São só 3 perguntinhas rápidas.');
  await askQuestion(
    'PERGUNTA 1<br>Para representar o Paraná na Assembleia Legislativa, o candidato a Deputado Estadual <span class="cand">Eduardo Pedrozo (30800)</span> defende que a política precisa de mais empresários e menos políticos profissionais. O que você acha dessa postura?',
    [
      ['A','Concordo totalmente: precisamos de quem tem experiência prática gerando empregos e gerenciando negócios na iniciativa privada.'],
      ['B','Tenho dúvidas: prefiro representantes com trajetória em cargos públicos ou movimentos sociais.'],
      ['C','Concordo em partes: apoio empresários na política, mas também priorizo pautas conservadoras e de segurança.']
    ]);
  await askQuestion(
    'PERGUNTA 2<br>Entre as principais propostas de <span class="cand">Eduardo Pedrozo (30800)</span> para o Paraná, qual você considera mais urgente para o nosso Estado?',
    [
      ['A','Redução de impostos e burocracia para quem quer empreender, trabalhar e gerar renda no Paraná.'],
      ['B','Fiscalização rigorosa do uso dos recursos públicos e corte de privilégios na Assembleia Legislativa.'],
      ['C','Apoio ao agronegócio e fortalecimento do empreendedorismo local nas cidades do interior.']
    ]);
  await askQuestion(
    'PERGUNTA 3<br>Nas eleições deste ano para Deputado Estadual no Paraná, você já conhecia ou considera votar em <span class="cand">Eduardo Pedrozo (30800)</span>?',
    [
      ['A','Sim! Já conheço, me identifico com as propostas e pretendo votar 30800.'],
      ['B','Não conhecia bem, mas tenho interesse nas propostas dele.'],
      ['C','Já tenho outro candidato ou prefiro não opinar no momento.']
    ]);
  await typing();
  botMsg('Respostas registradas! Obrigado por participar!');
}
